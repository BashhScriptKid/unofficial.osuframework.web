name: Build DocFX Page

on:
  workflow_run:
    workflows: ["Bump osu!framework API reference"] # Runs at midnight and we want to make sure the reference is updated first before we build a new version of docs site
    types:
      - completed
  workflow_dispatch: # Manual run
  

jobs:
  Check-new-commit-since:
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.commitComparison.outputs.skip_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to compare full commit hashes

      - name: Restore last commit hash cache
        id: restore_commit_cache
        uses: actions/cache/restore@v4
        with:
          path: ./.github/workflows/LAST_COMMIT
          key: last-commit-hash

      - name: Compare current commit to last recorded
        id: commitComparison
        run: |
          current_commit=$(git rev-parse HEAD)

          if [ -f .github/workflows/LAST_COMMIT ] && [ "$current_commit" = "$(cat .github/workflows/LAST_COMMIT)" ]; then
            echo "No new commits. Skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "$current_commit" > ./.github/workflows/LAST_COMMIT
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save updated commit hash cache
        if: steps.commitComparison.outputs.skip_build == 'false'
        uses: actions/cache/save@v4
        with:
          path: ./.github/workflows/LAST_COMMIT
          key: last-commit-hash
    
  Build-site:
    runs-on: ubuntu-latest
    needs: Check-new-commit-since
    if: needs.Check-new-commit-since.outputs.skip_build == 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3.4.2
        with:
          dotnet-version: 8.0.x # or match osu!framework's version

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Add DocFX to PATH
        run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: Build site
        run: docfx build ./docfx.json

      - name: Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add ./_site
          git commit -m "Update site $(date +"%Y%m%d.%H%M (%N)")"
          git push
