name: Bump osu!framework API reference

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Update-framework-repo:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.bump.outputs.commit_hash }}
      skip_build: ${{ steps.bump.outputs.skip_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 0 # Needed for full commit info in submodules
            submodules: recursive

      - name: Update submodule
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Bump osu!framework submodule
        id: bump
        run: |
          cd osu-framework
          git fetch origin master

          current_commit=$(git rev-parse HEAD)
          remote_commit=$(git rev-parse origin/master)

          echo "Comparing local: $current_commit to remote: $remote_commit"

          if [ "$current_commit" = "$remote_commit" ]; then
            echo "Submodule is up to date. Skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "commit_hash=$current_commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Not up to date — set outputs
          echo "skip_build=false" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$remote_commit" >> "$GITHUB_OUTPUT"

          if ! git pull --ff-only origin master; then
            echo "Fast-forward failed, attempting rebase..."
            git pull --rebase origin master
          fi

          cd ..

      - name: Push changes
        if: steps.bump.outputs.skip_build == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          remote_commit=$(git -C osu-framework rev-parse HEAD)
          COMMIT_MSG="Midnight chore: Bump osu!framework submodule to ${remote_commit:0:5}"

          git add osu-framework
          git commit -m "$COMMIT_MSG" -m "https://github.com/ppy/osu-framework/commit/${remote_commit}" || echo "Nothing to commit"
          git push

  Update-reference:
      needs: Update-framework-repo
      if: needs.Update-framework-repo.outputs.skip_build == 'false'
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
              fetch-depth: 0
              submodules: recursive

        - name: Pull updated branch
          run: git pull --ff-only

        - name: Update submodule
          run: |
            git submodule sync
            git submodule update --init --recursive

        - name: Set up .NET SDK
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 8.0.x

        - name: Restore dependencies
          run: dotnet restore ./osu-framework/osu-framework.sln

        - name: Install DocFX
          run: dotnet tool update -g docfx

        - name: Add DocFX to PATH
          run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

        - name: Build metadata from osu!framework
          run: docfx metadata ./docfx.json

        - name: Generate grouped API toc
          run: bash ./.github/workflows/generate_api_toc.sh ./api

        - name: Update API markdown info
          run: bash ./.github/workflows/writeHome.sh ./api/Home.md ${{needs.Update-framework-repo.outputs.commit_hash}}

        - name: Commit and push updated docs
          run: |
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add api
            COMMIT_MSG="Midnight chore: Update API references"
            git commit -m "$COMMIT_MSG" || echo "No API doc changes"
            git push
